<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle" data-i18n="app.title">DumbAssets</title>
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/dumbassets.svg">
</head>
<body>
    <main>
        <form id="pinForm">
            <div class="pin-header-row">
                <h1 id="siteTitle" data-i18n="app.title">DumbAssets</h1>
                <label for="languageSelect" class="visually-hidden" data-i18n="language.label">Language</label>
                <select id="languageSelect" class="language-select" data-i18n-aria-label="language.label">
                    <option value="en" data-i18n="language.option.en">English</option>
                    <option value="zh" data-i18n="language.option.zh">Chinese</option>
                </select>
                <button id="themeToggle" class="theme-toggle" data-i18n-aria-label="theme.aria" role="button" type="button">
                    <svg class="moon">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
                    </svg>
                    <svg class="sun">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M14.828 14.828a4 4 0 1 0 -5.656 -5.656a4 4 0 0 0 5.656 5.656z" />
                        <path d="M6.343 17.657l-1.414 1.414" />
                        <path d="M6.343 6.343l-1.414 -1.414" />
                        <path d="M17.657 6.343l1.414 -1.414" />
                        <path d="M17.657 17.657l1.414 1.414" />
                        <path d="M4 12h-2" />
                        <path d="M12 4v-2" />
                        <path d="M20 12h2" />
                        <path d="M12 20v2" />
                    </svg>
                </button>
            </div>
            <h2 data-i18n="pin.enter">Enter PIN</h2>
            <div class="pin-input-container"></div>
            <div class="pin-error" role="alert" aria-hidden="true" data-i18n="pin.incorrect">Incorrect PIN. Please try again.</div>
        </form>
    </main>
    <div class="dumbware-credit" data-i18n="credit.builtBy">
        Built by <a href="https://dumbware.io" target="_blank" rel="noopener noreferrer">DumbWare</a>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const pinContainer = document.querySelector('.pin-input-container');
            const pinForm = document.getElementById('pinForm');
            const errorDisplay = document.querySelector('.pin-error');

            const submitPin = async () => {
                const inputs = Array.from(pinContainer.querySelectorAll('input'));
                const pin = inputs.map(input => input.value).join('').trim();
                
                try {
                    const response = await fetch('verify-pin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ pin }),
                        credentials: 'same-origin',
                        redirect: 'follow'
                    });
                    
                    if (response.redirected) {
                        window.location.replace(response.url);
                        return;
                    }
                    
                    const data = await response.json();
                    
                    if (response.status === 429) {
                        errorDisplay.textContent = data.error;
                        errorDisplay.setAttribute('aria-hidden', 'false');
                        inputs.forEach(input => {
                            input.value = '';
                            input.classList.remove('has-value');
                            input.disabled = true;
                        });
                    } else {
                        const message = data.attemptsLeft > 0
                            ? (window.i18n && window.i18n.format
                                ? window.i18n.format('pin.remainingAttempts', { count: data.attemptsLeft })
                                : `Incorrect PIN. ${data.attemptsLeft} attempts remaining.`)
                            : ((window.i18n && window.i18n.t)
                                ? window.i18n.t('pin.lastAttempt')
                                : 'Incorrect PIN. Last attempt before lockout.');
                        
                        errorDisplay.textContent = message;
                        errorDisplay.setAttribute('aria-hidden', 'false');
                        inputs.forEach(input => {
                            input.value = '';
                            input.classList.remove('has-value');
                        });
                        inputs[0].focus();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    errorDisplay.textContent = (window.i18n && window.i18n.t)
                        ? window.i18n.t('error.generic')
                        : 'An error occurred. Please try again.';
                    errorDisplay.setAttribute('aria-hidden', 'false');
                }
            };

            pinForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                try {
                    await submitPin();
                } catch (error) {
                    console.error('Error:', error);
                }
            });
            
            fetch('pin-length')
                .then(response => response.json())
                .then(data => {
                    const pinLength = data.length;
                    const container = document.querySelector('.pin-input-container');
                    
                    for (let i = 0; i < pinLength; i++) {
                        const input = document.createElement('input');
                        input.type = 'password';
                        input.maxLength = 1;
                        input.className = 'pin-input';
                        input.setAttribute('inputmode', 'numeric');
                        input.pattern = '[0-9]*';
                        input.setAttribute('autocomplete', 'off');
                        container.appendChild(input);
                    }

                    const inputs = container.querySelectorAll('.pin-input');
                    
                    if (inputs.length > 0) {
                        inputs[0].focus();
                    }

                    inputs.forEach((input, index) => {
                        input.addEventListener('input', (e) => {
                            e.target.value = e.target.value.replace(/[^0-9]/g, '');
                            
                            if (e.target.value) {
                                e.target.classList.add('has-value');
                                if (index < inputs.length - 1) {
                                    inputs[index + 1].focus();
                                } else {
                                    submitPin();
                                }
                            } else {
                                e.target.classList.remove('has-value');
                            }
                        });

                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Backspace' && !e.target.value && index > 0) {
                                inputs[index - 1].focus();
                            }
                        });

                        input.addEventListener('paste', (e) => {
                            e.preventDefault();
                            const pastedData = e.clipboardData.getData('text');
                            const numbers = pastedData.match(/\d/g);
                            
                            if (numbers) {
                                numbers.forEach((num, i) => {
                                    if (inputs[index + i]) {
                                        inputs[index + i].value = num;
                                        inputs[index + i].classList.add('has-value');
                                        if (index + i + 1 < inputs.length) {
                                            inputs[index + i + 1].focus();
                                        } else {
                                            submitPin();
                                        }
                                    }
                                });
                            }
                        });
                    });
                });
            
            setTimeout(() => {
                const firstInput = pinContainer.querySelector('input');
                if (firstInput) firstInput.focus();
            }, 100);

            if (window.appConfig && window.appConfig.siteTitle) {
                const siteTitleElem = document.getElementById('siteTitle');
                if (siteTitleElem) {
                    siteTitleElem.textContent = window.appConfig.siteTitle || 'DumbAssets';
                }
                const pageTitleElem = document.getElementById('pageTitle');
                if (pageTitleElem) {
                    pageTitleElem.textContent = window.appConfig.siteTitle || 'DumbAssets';
                }
            }
        });
    </script>
</body>
</html>
